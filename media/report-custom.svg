<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Custom report builder proof mockup</title>
  <desc id="desc">A custom report with every filter field visible and two charts side by side: release type pie and missing releases by decade.</desc>
  <rect width="1440" height="900" rx="18" fill="#17191b"/>
  <rect width="1440" height="58" rx="18" fill="#2b2f33"/>
  <rect y="44" width="1440" height="14" fill="#2b2f33"/>
  <circle cx="28" cy="29" r="9" fill="#b27a30"/>
  <circle cx="28" cy="29" r="4" fill="#e3c297"/>
  <text x="52" y="36" fill="#e5e5e5" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="650">Missing Music</text>
  <text x="1290" y="36" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="13">DEMO DATA</text>

  <rect y="58" width="260" height="842" fill="#1d2023"/>
  <text x="32" y="108" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="1.6">REPORTS</text>
  <rect x="20" y="128" width="220" height="42" rx="7" fill="#3a3026" stroke="#b27a30"/>
  <text x="48" y="155" fill="#e3c297" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600">+ Create new report</text>
  <text x="48" y="204" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="14">Missing official releases</text>
  <text x="48" y="244" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="14">Missing tracks</text>
  <text x="48" y="284" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="14">Missing by decade</text>
  <text x="32" y="348" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="1.6">SAVED</text>
  <text x="48" y="392" fill="#e5e5e5" font-family="Inter,Segoe UI,sans-serif" font-size="14">Vinyl from the 90s</text>
  <text x="48" y="432" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="14">Missing UK albums</text>
  <text x="48" y="472" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="14">Favourites, owned</text>

  <rect x="260" y="58" width="1180" height="842" fill="#17191b"/>
  <text x="306" y="118" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="1.6">CUSTOM REPORT</text>
  <text x="306" y="166" fill="#e5e5e5" font-family="Archivo,Inter,sans-serif" font-size="32" font-weight="650">Missing, Album, 1990s, Vinyl</text>
  <text x="306" y="198" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="15">Saved. Rename or delete from the rail.</text>

  <!-- Filter bar: every custom-report field is visible -->
  <rect x="306" y="224" width="1064" height="56" rx="10" fill="#1d2023" stroke="#34383c"/>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="12">
    <rect x="320" y="236" width="118" height="32" rx="8" fill="#3a3026" stroke="#b27a30"/>
    <text x="334" y="257" fill="#e3c297" font-weight="600">Type: Album</text>

    <rect x="448" y="236" width="86" height="32" rx="8" fill="#25282c" stroke="#45494d"/>
    <text x="462" y="257" fill="#c8c8c8">Status</text>
    <text x="510" y="257" fill="#737373">▾</text>

    <rect x="544" y="236" width="108" height="32" rx="8" fill="#3a3026" stroke="#b27a30"/>
    <text x="558" y="257" fill="#e3c297" font-weight="600">Missing</text>
    <text x="626" y="257" fill="#e3c297">▾</text>

    <rect x="662" y="236" width="92" height="32" rx="8" fill="#3a3026" stroke="#b27a30"/>
    <text x="676" y="257" fill="#e3c297" font-weight="600">1990s</text>
    <text x="728" y="257" fill="#e3c297">▾</text>

    <rect x="764" y="236" width="86" height="32" rx="8" fill="#3a3026" stroke="#b27a30"/>
    <text x="778" y="257" fill="#e3c297" font-weight="600">Vinyl</text>
    <text x="824" y="257" fill="#e3c297">▾</text>

    <rect x="860" y="236" width="104" height="32" rx="8" fill="#25282c" stroke="#45494d"/>
    <text x="874" y="257" fill="#c8c8c8">Country</text>
    <text x="938" y="257" fill="#737373">▾</text>

    <rect x="974" y="236" width="136" height="32" rx="8" fill="#25282c" stroke="#45494d"/>
    <circle cx="994" cy="252" r="6" fill="none" stroke="#737373" stroke-width="1.4"/>
    <text x="1008" y="257" fill="#c8c8c8">Favourites</text>
  </g>
  <text x="320" y="302" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="11">Type · Status · Owned/missing · Decade · Media type · Country · Favourites</text>

  <!-- Two side-by-side charts -->
  <rect x="306" y="324" width="516" height="348" rx="10" fill="#25282c" stroke="#34383c"/>
  <text x="330" y="360" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="0.8">RELEASE TYPE DISTRIBUTION</text>
  <!-- Pie: Album 48%, EP 18%, Single 20%, Compilation 14% -->
  <g transform="translate(564 520)">
    <path d="M0,-92 A92,92 0 0,1 10.9,91.4 L0,0 Z" fill="#b27a30"/>
    <path d="M10.9,91.4 A92,92 0 0,1 -87.4,28.6 L0,0 Z" fill="#d0ae80"/>
    <path d="M-87.4,28.6 A92,92 0 0,1 -54.1,-74.4 L0,0 Z" fill="#6b8cae"/>
    <path d="M-54.1,-74.4 A92,92 0 0,1 0,-92 L0,0 Z" fill="#5a8f7a"/>
    <circle r="38" fill="#25282c"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="12">
    <rect x="330" y="618" width="10" height="10" rx="2" fill="#b27a30"/>
    <text x="346" y="628" fill="#c8c8c8">Album</text>
    <rect x="412" y="618" width="10" height="10" rx="2" fill="#d0ae80"/>
    <text x="428" y="628" fill="#c8c8c8">EP</text>
    <rect x="470" y="618" width="10" height="10" rx="2" fill="#6b8cae"/>
    <text x="486" y="628" fill="#c8c8c8">Single</text>
    <rect x="554" y="618" width="10" height="10" rx="2" fill="#5a8f7a"/>
    <text x="570" y="628" fill="#c8c8c8">Compilation</text>
  </g>

  <rect x="854" y="324" width="516" height="348" rx="10" fill="#25282c" stroke="#34383c"/>
  <text x="878" y="360" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="0.8">MISSING RELEASES BY DECADE</text>
  <g>
    <line x1="894" y1="612" x2="1334" y2="612" stroke="#45494d"/>
    <rect x="910" y="548" width="44" height="64" rx="4" fill="#b27a30"/>
    <rect x="978" y="500" width="44" height="112" rx="4" fill="#b27a30"/>
    <rect x="1046" y="428" width="44" height="184" rx="4" fill="#d0ae80"/>
    <rect x="1114" y="472" width="44" height="140" rx="4" fill="#b27a30"/>
    <rect x="1182" y="524" width="44" height="88" rx="4" fill="#b27a30"/>
    <rect x="1250" y="568" width="44" height="44" rx="4" fill="#b27a30"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="#a5a5a5" text-anchor="middle">
    <text x="932" y="636">70s</text>
    <text x="1000" y="636">80s</text>
    <text x="1068" y="636">90s</text>
    <text x="1136" y="636">00s</text>
    <text x="1204" y="636">10s</text>
    <text x="1272" y="636">20s</text>
  </g>

  <!-- Table peek so the result is a full report, not just charts -->
  <rect x="306" y="696" width="1064" height="164" rx="10" fill="#25282c" stroke="#34383c"/>
  <text x="330" y="728" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="0.8">RESULTS · ARTIST / TITLE / DATE / TYPE / STATUS / COUNTRY</text>
  <line x1="330" y1="744" x2="1342" y2="744" stroke="#45494d"/>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="14">
    <text x="330" y="776" fill="#e5e5e5">Hollow Lantern · The Long Way Home</text>
    <text x="820" y="776" fill="#a5a5a5">1994</text>
    <text x="920" y="776" fill="#a5a5a5">Album</text>
    <text x="1040" y="776" fill="#a5a5a5">Official</text>
    <text x="1180" y="776" fill="#a5a5a5">GB</text>
    <line x1="330" y1="796" x2="1342" y2="796" stroke="#34383c"/>
    <text x="330" y="828" fill="#e5e5e5">Static Bloom · Rooms at Dawn</text>
    <text x="820" y="828" fill="#a5a5a5">1997</text>
    <text x="920" y="828" fill="#a5a5a5">Album</text>
    <text x="1040" y="828" fill="#a5a5a5">Official</text>
    <text x="1180" y="828" fill="#a5a5a5">US</text>
  </g>
</svg>
