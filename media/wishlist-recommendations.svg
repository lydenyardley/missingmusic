<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Missing Music wishlist and recommendations proof mockup</title>
  <desc id="desc">A collection desk with missing releases saved to a wishlist and optional recommendations alongside them.</desc>
  <rect width="1440" height="900" rx="18" fill="#17191b"/><rect width="1440" height="58" rx="18" fill="#2b2f33"/><rect y="44" width="1440" height="14" fill="#2b2f33"/>
  <circle cx="28" cy="29" r="9" fill="#b27a30"/><circle cx="28" cy="29" r="4" fill="#e3c297"/><text x="52" y="36" fill="#e5e5e5" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="650">Missing Music</text><text x="1290" y="36" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="13">DEMO DATA</text>
  <rect y="58" width="260" height="842" fill="#1d2023"/><text x="32" y="108" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="1.6">COLLECTION DESK</text><rect x="20" y="128" width="220" height="42" rx="7" fill="#3a3026" stroke="#b27a30"/><text x="48" y="155" fill="#e3c297" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600">Wishlist</text><text x="48" y="204" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="14">Recommendations</text><text x="48" y="252" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="14">Owned library</text><line x1="20" y1="780" x2="240" y2="780" stroke="#34383c"/><text x="32" y="824" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12">OPTIONAL SAMPLES</text><text x="32" y="850" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="13">Off by default</text>
  <rect x="260" y="58" width="1180" height="842" fill="#17191b"/><text x="306" y="118" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="1.6">COLLECTION DESK / NEXT ACTION</text><text x="306" y="166" fill="#e5e5e5" font-family="Archivo,Inter,sans-serif" font-size="34" font-weight="650">Save the gaps you mean to fill.</text><text x="306" y="198" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="15">Your library suggests a path; you choose what happens next.</text>
  <text x="306" y="260" fill="#d0ae80" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600">WISHLIST · 3 RELEASES</text>
  <rect x="306" y="284" width="488" height="456" rx="10" fill="#25282c" stroke="#b27a30"/><rect x="334" y="314" width="170" height="170" rx="7" fill="#5c405f"/><circle cx="419" cy="399" r="50" fill="#19151d" opacity=".65"/><circle cx="419" cy="399" r="8" fill="#e3c297"/><text x="532" y="352" fill="#e5e5e5" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="600">Copper Season</text><text x="532" y="382" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="13">2019 · Album</text><rect x="532" y="412" width="106" height="28" rx="14" fill="#3e2c2b"/><text x="554" y="431" fill="#ff99a4" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="600">Missing</text><line x1="334" y1="526" x2="766" y2="526" stroke="#3b3f43"/><text x="334" y="564" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12">WHY IT IS HERE</text><text x="334" y="594" fill="#e5e5e5" font-family="Inter,Segoe UI,sans-serif" font-size="14">The complete discography shows a gap.</text><rect x="334" y="650" width="166" height="40" rx="20" fill="#b27a30"/><text x="371" y="675" fill="#1a1a1a" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Keep on wishlist</text>
  <text x="838" y="260" fill="#d0ae80" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600">OPTIONAL RECOMMENDATIONS</text>
  <rect x="838" y="284" width="492" height="456" rx="10" fill="#25282c" stroke="#34383c"/><rect x="866" y="314" width="126" height="126" rx="7" fill="#2d5b67"/><circle cx="929" cy="377" r="38" fill="#111b20" opacity=".68"/><circle cx="929" cy="377" r="7" fill="#d0ae80"/><text x="1020" y="348" fill="#e5e5e5" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="600">Wayside</text><text x="1020" y="376" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="13">Because you own Hollow Lantern</text><rect x="1020" y="402" width="118" height="27" rx="14" fill="#303c43"/><text x="1040" y="420" fill="#d0ae80" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="600">Library seeded</text><line x1="866" y1="476" x2="1302" y2="476" stroke="#3b3f43"/><text x="866" y="516" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12">CONTROL STAYS WITH YOU</text><text x="866" y="548" fill="#e5e5e5" font-family="Inter,Segoe UI,sans-serif" font-size="14">Recommendations are optional.</text><text x="866" y="576" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="14">Samples stay off until you enable them.</text><rect x="866" y="640" width="182" height="40" rx="20" fill="#2b2f33" stroke="#d0ae80"/><text x="906" y="665" fill="#d0ae80" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600">Explore suggestions</text>
