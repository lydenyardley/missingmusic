  <rect x="260" y="58" width="1180" height="842" fill="#17191b"/><text x="306" y="118" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="1.6">REPORTS / ADVANCED REPORTS</text><text x="306" y="166" fill="#e5e5e5" font-family="Archivo,Inter,sans-serif" font-size="34" font-weight="650">Editions with extra tracks</text><text x="306" y="198" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="15">Which editions contain material you do not have?</text>
