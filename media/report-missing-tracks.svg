<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Missing tracks from owned releases report proof mockup</title>
  <desc id="desc">A report table showing owned releases whose local track count is lower than the catalog track count.</desc>
  <rect width="1440" height="900" rx="18" fill="#17191b"/><rect width="1440" height="58" rx="18" fill="#2b2f33"/><rect y="44" width="1440" height="14" fill="#2b2f33"/>
  <circle cx="28" cy="29" r="9" fill="#b27a30"/><circle cx="28" cy="29" r="4" fill="#e3c297"/><text x="52" y="36" fill="#e5e5e5" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="650">Missing Music</text><text x="1290" y="36" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="13">DEMO DATA</text>
  <rect y="58" width="260" height="842" fill="#1d2023"/><text x="32" y="108" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="1.6">REPORTS</text><text x="48" y="152" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="14">Editions with extra tracks</text><rect x="20" y="176" width="220" height="42" rx="7" fill="#3a3026" stroke="#b27a30"/><text x="48" y="203" fill="#e3c297" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600">Missing tracks</text><text x="48" y="252" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="14">Missing releases</text>
  <rect x="260" y="58" width="1180" height="842" fill="#17191b"/><text x="306" y="118" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="1.6">REPORTS / ADVANCED REPORTS</text><text x="306" y="166" fill="#e5e5e5" font-family="Archivo,Inter,sans-serif" font-size="34" font-weight="650">Missing tracks from owned releases</text><text x="306" y="198" fill="#a5a5a5" font-family="Inter,Segoe UI,sans-serif" font-size="15">Which releases look owned but are incomplete?</text>
  <rect x="306" y="238" width="330" height="102" rx="10" fill="#25282c" stroke="#34383c"/><text x="334" y="270" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12">OWNED RELEASES CHECKED</text><text x="334" y="316" fill="#d0ae80" font-family="Archivo,Inter,sans-serif" font-size="30" font-weight="650">84</text>
  <rect x="654" y="238" width="330" height="102" rx="10" fill="#25282c" stroke="#34383c"/><text x="682" y="270" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12">INCOMPLETE RELEASES</text><text x="682" y="316" fill="#ff99a4" font-family="Archivo,Inter,sans-serif" font-size="30" font-weight="650">7</text>
  <rect x="1002" y="238" width="368" height="102" rx="10" fill="#25282c" stroke="#34383c"/><text x="1030" y="270" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12">TRACKS TO CHECK</text><text x="1030" y="316" fill="#b27a30" font-family="Archivo,Inter,sans-serif" font-size="30" font-weight="650">12</text>
  <rect x="306" y="370" width="1064" height="430" rx="10" fill="#25282c" stroke="#34383c"/><text x="334" y="410" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="1">RESULTS · OWNED RELEASES ONLY</text><text x="334" y="452" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12">ARTIST / RELEASE</text><text x="820" y="452" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12">YOUR FILES</text><text x="990" y="452" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12">CATALOG</text><text x="1224" y="452" fill="#737373" font-family="Inter,Segoe UI,sans-serif" font-size="12">MISSING</text><line x1="334" y1="470" x2="1342" y2="470" stroke="#45494d"/>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="14">
    <text x="334" y="512" fill="#e5e5e5">Hollow Lantern · Static Bloom</text><text x="820" y="512" fill="#a5a5a5">8 tracks</text><text x="990" y="512" fill="#a5a5a5">10 tracks</text><rect x="1218" y="490" width="90" height="28" rx="14" fill="#3e2c2b"/><text x="1241" y="509" fill="#ff99a4" font-size="12" font-weight="600">2 tracks</text><line x1="334" y1="536" x2="1342" y2="536" stroke="#34383c"/>
    <text x="334" y="578" fill="#e5e5e5">Static Bloom · Rooms at Dawn</text><text x="820" y="578" fill="#a5a5a5">11 tracks</text><text x="990" y="578" fill="#a5a5a5">12 tracks</text><rect x="1218" y="556" width="90" height="28" rx="14" fill="#3e2c2b"/><text x="1241" y="575" fill="#ff99a4" font-size="12" font-weight="600">1 track</text><line x1="334" y1="602" x2="1342" y2="602" stroke="#34383c"/>
    <text x="334" y="644" fill="#e5e5e5">Wayside · Field Notes</text><text x="820" y="644" fill="#a5a5a5">5 tracks</text><text x="990" y="644" fill="#a5a5a5">7 tracks</text><rect x="1218" y="622" width="90" height="28" rx="14" fill="#3e2c2b"/><text x="1241" y="641" fill="#ff99a4" font-size="12" font-weight="600">2 tracks</text><line x1="334" y1="668" x2="1342" y2="668" stroke="#34383c"/>
    <text x="334" y="710" fill="#a5a5a5">A complete release can still hide an incomplete local copy.</text>
  </g>
